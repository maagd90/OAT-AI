# ─────────────────────────────────────────────
# AI Provider Configuration
# ─────────────────────────────────────────────

# Active provider: gemini | openai
ai.provider=gemini

# Common settings
ai.timeout=30000
ai.temperature=0.7
ai.maxTokens=2000

# ─────────────────────────────────────────────
# Gemini settings
# ─────────────────────────────────────────────
ai.gemini.model=gemini-2.0-flash
# Encrypted key (use lib/ai/crypto.ts encrypt() to produce):
# ai.gemini.api.key.enc=ENC(base64-encrypted-value)
# If unset, falls back to GEMINI_API_KEY env var.
ai.gemini.api.key.enc=

# ─────────────────────────────────────────────
# OpenAI settings
# ─────────────────────────────────────────────
ai.openai.model=gpt-4o-mini
# Encrypted key:
# ai.openai.api.key.enc=ENC(base64-encrypted-value)
# If unset, falls back to OPENAI_API_KEY env var.
ai.openai.api.key.enc=
