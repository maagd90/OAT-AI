# Demo data source mode: live | mock | fallback
# live: use open-source APIs only
# mock: use local mock dataset only
# fallback: try APIs first, then fallback to mock if empty/error

demo.dataMode=fallback

demo.mock.destination=Dubai
demo.mock.country=United Arab Emirates
demo.mock.lat=25.2048
demo.mock.lon=55.2708
demo.mock.currency=USD
demo.mock.hotelsCount=8
demo.mock.attractionsCount=10
demo.mock.weatherDaysDefault=7

# Itinerary engine mode: oss-ai | rule-based
demo.itinerary.mode=oss-ai
# AI model used via Google Gemini API
demo.itinerary.model=gemini-2.0-flash

# Customer demo quality guards
demo.strictCityValidation=true
demo.maxDistanceKm=60
demo.autoFallbackOnValidation=true
